[project]
name = "synora_agentic_erp"
authors = [{ name = "Atlax-Tech" }]
description = "Governed Agentic Enterprise Operations for ERPNext"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.4",
]
lab = [
    "smolagents @ git+https://github.com/huggingface/smolagents.git@30bb1161095dbae2271e6bc3cc4c219cc3897a57",
]
workflow-lab = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
]

[tool.uv.workspace]
members = ["services/agent_runtime"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".agents", ".workbuddy", "env/dev"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

# RUF001/003 只豁免面向用户/模型的中文 UI 文案与文案断言 (全角标点是中文正常排版)。
[tool.ruff.lint.per-file-ignores]
"synora_agentic_erp/agent/plan.py" = ["RUF001"]
"tests/test_plan.py" = ["RUF001"]
"services/agent_runtime/src/agent_runtime/agent/enhance.py" = ["RUF001"]
"services/agent_runtime/tests/test_enhance.py" = ["RUF001", "RUF003"]
"services/agent_runtime/tests/test_evaluation.py" = ["RUF003"]
"services/agent_runtime/tests/test_security_eval.py" = ["RUF001"]
"services/agent_runtime/tests/test_enhance_endpoint.py" = ["RUF001"]
"services/agent_runtime/tests/test_retrieval.py" = ["RUF001"]
"services/agent_runtime/src/agent_runtime/app.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
files = [
    "synora_agentic_erp/__init__.py",
    "synora_agentic_erp/hooks.py",
    "synora_agentic_erp/api.py",
    "synora_agentic_erp/agent",
    "synora_agentic_erp/gateway",
    "synora_agentic_erp/synora_agentic_erp",
    "services/agent_runtime/src",
    "tests",
]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["services/agent_runtime/src"]
testpaths = ["tests", "services/agent_runtime/tests"]
